schema_version: 1

context:
  version: "25.12.19-2026-02-06-03fffb2"

package:
  name: flatbuffers
  version: ${{ version }}

source:
  url: https://github.com/google/flatbuffers/archive/v${{ version }}.tar.gz
  sha256: ccbce58684691de1e7d51f5e87786266b37d06ab66e9dfe2d0ec106fe50aace0

build:
  number: 0

requirements:
  build:
    - cmake
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - ninja
  run_exports:
    - ${{ pin_subpackage('flatbuffers', upper_bound='x.x.x') }}

tests:
  - script:
      - if: not win
        then:
          - test -f $PREFIX/bin/flatc
          - test -f $PREFIX/include/flatbuffers/flatbuffers.h
          - test -f $PREFIX/lib/libflatbuffers${SHLIB_EXT}
        else:
          - if not exist %PREFIX%\\Library\\bin\\flatc.exe exit 1
          - if not exist %PREFIX%\\Library\\include\\flatbuffers\\flatbuffers.h exit 1
      - if: linux
        then: test -f ${PREFIX}/lib/libflatbuffers.so.${{ version }}

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Memory Efficient Serialization Library
  homepage: http://google.github.io/flatbuffers/

extra:
  recipe-maintainers:
    - wesm
    - msarahan
    - jakirkham
    - xhochy
